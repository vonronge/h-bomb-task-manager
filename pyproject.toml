[build-system]
requires = ["maturin>=1.7,<2"]
build-backend = "maturin"

[project]
name = "hbomb"
version = "0.1.0"
description = "Native Qt6 system monitor for Linux — CPU, GPU, memory, disk, processes, and more"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
authors = [{ name = "Freddie" }]
dependencies = [
  "PySide6>=6.7",
  "nvidia-ml-py>=12",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
hbomb = "hbomb.__main__:main"

[tool.maturin]
manifest-path = "native/Cargo.toml"
module-name = "hbomb._native"
python-source = "."

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
